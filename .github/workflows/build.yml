name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build render shared library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)    zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=libafw_render.so ;;
            macOS)    zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=libafw_render.dylib ;;
            Windows)  zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=afw_render.dll ;;
          esac

      - name: Build afw_media CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            zig build-exe afw_media.zig -O ReleaseFast -femit-bin=afw_media.exe
          else
            zig build-exe afw_media.zig -O ReleaseFast -femit-bin=afw_media
          fi

      - name: Smoke test (all OS)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./afw_media.exe; else BIN=./afw_media; fi
          python3 -c "import afw; print('framework import OK')" || python -c "import afw; print('framework import OK')"
          "$BIN" --help > /dev/null

      - name: Conversion smoke test
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./afw_media.exe; else BIN=./afw_media; fi
          ffmpeg -y -v error -f lavfi -i testsrc=size=64x48:rate=1 -frames:v 1 t.png
          "$BIN" t.png --cols 40 --no-loader -q -o t.afwframes
          python3 -c "
          import struct
          d = open('t.afwframes', 'rb').read()
          m, c, r, n, f = struct.unpack('<4sIIIf', d[:20])
          assert m == b'AFW1', 'bad magic'
          assert n == 1 and len(d) == 20 + c * r * 6, 'bad frame data'
          print('asset OK:', m.decode(), c, 'x', r, '-', n, 'frame')
          " || python -c "
          import struct
          d = open('t.afwframes', 'rb').read()
          m, c, r, n, f = struct.unpack('<4sIIIf', d[:20])
          assert m == b'AFW1', 'bad magic'
          assert n == 1 and len(d) == 20 + c * r * 6, 'bad frame data'
          print('asset OK:', m.decode(), c, 'x', r, '-', n, 'frame')
          "

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then cp afw_media.exe dist/; else cp afw_media dist/; fi
          cp libafw_render.so libafw_render.dylib afw_render.dll dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: afw-${{ matrix.os }}
          path: dist/
