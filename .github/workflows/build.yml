name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build render shared library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)    zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=libafw_render.so ;;
            macOS)    zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=libafw_render.dylib ;;
            Windows)  zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=afw_render.dll ;;
          esac

      - name: Build afw_media CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            zig build-exe afw_media.zig -O ReleaseFast -femit-bin=afw_media.exe
          else
            zig build-exe afw_media.zig -O ReleaseFast -femit-bin=afw_media
          fi

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./afw_media.exe --help > /dev/null
          else
            ./afw_media --help > /dev/null
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then cp afw_media.exe dist/; else cp afw_media dist/; fi
          cp libafw_render.so libafw_render.dylib afw_render.dll dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: afw-${{ matrix.os }}
          path: dist/
