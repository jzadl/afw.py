name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: afw-linux
            ext: ""
          - os: macos-latest
            artifact: afw-macos
            ext: ""
          - os: windows-latest
            artifact: afw-windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build render shared library
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)    zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=libafw_render.so ;;
            macOS)    zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=libafw_render.dylib ;;
            Windows)  zig build-lib afw_render.zig -dynamic -fPIC -O ReleaseFast -femit-bin=afw_render.dll ;;
          esac

      - name: Build afw_media CLI
        shell: bash
        run: zig build-exe afw_media.zig -O ReleaseFast -femit-bin=afw_media${{ matrix.ext }}

      - name: Smoke test
        shell: bash
        run: ./afw_media${{ matrix.ext }} --help > /dev/null

      - name: Generate afw.py bundle
        shell: bash
        run: python3 builders/bundle.py

      - name: Package (release zip only)
        shell: bash
        run: |
          mkdir -p dist/examples
          # user-facing files only: framework, binaries, player, examples
          cp afw.py dist/
          cp afw_media${{ matrix.ext }} dist/
          cp libafw_render.so dist/ 2>/dev/null || true
          cp libafw_render.dylib dist/ 2>/dev/null || true
          cp afw_render.dll dist/ 2>/dev/null || true
          cp afw_stream_player.py dist/
          cp examples/*.py dist/examples/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cd dist && 7z a "../${{ matrix.artifact }}.zip" .
          else
            cd dist && zip -r "../${{ matrix.artifact }}.zip" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in artifacts/*/afw-*; do
            echo "uploading $f"
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
